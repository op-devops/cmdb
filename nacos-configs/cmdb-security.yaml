# data-id: auth-security.yaml  group: DEFAULT_GROUP  格式: YAML
# 内部 gRPC 调用的共享令牌。网关和 gRPC 服务都读这一份,轮换时改这里,两边热更新。
#
# 轮换步骤(不停机):
#   1. 生成新令牌  python3 -c "import secrets;print(secrets.token_urlsafe(32))"
#   2. 改这里并发布,两端会在几秒内各自热更新
#   3. 期间可能有极短的窗口两端令牌不一致,调用会 401;要零窗口就先把 token 置空
#      (置空 = 关闭鉴权),等两端都生效后再填新值

grpc:
  # 免鉴权的方法前缀(前缀匹配)。健康检查不带令牌,拦了容器会一直 unhealthy。
  # 整项删掉 -> 代码里的兜底值(只放行健康检查);写成 [] -> 一个都不放行。
  exempt_methods:
    - /grpc.health.v1.Health/
    - /grpc.reflection.v1alpha.ServerReflection/   # 用 grpcurl 调试时才需要,不用可删

  # 置空表示不启用鉴权(本地裸跑、单元测试时方便)
  token: "Z1as7YjnEeA6FDaDLP9CdcITkOH2dJlWILVBdK0HPaA"

  # 调用外部服务时带的令牌。值 = 对方 security 的 grpc.token,抄过来。
  # cmdb 网关要调 auth-service 的 VerifyToken 做登录校验。
  upstream_tokens:
    auth-service: "Z1as7YjnEeA6FDaDLP9CdcITkOH2dJlWILVBdK0HPaA"

