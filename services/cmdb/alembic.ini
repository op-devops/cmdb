# alembic 配置:只给 DBA 手动跑(python3 dev.py db-upgrade),不接自动化流水线。
# 连接串不写在这,由 alembic/env.py 从环境变量 CMDB_MIGRATOR_DATABASE_URL 读取(DDL 权限账号)。
[alembic]
script_location = services/cmdb/alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
